queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>=1"
      - -label~=(do-not-merge)
      - status-success=build
    merge_conditions:
      - "#approved-reviews-by>=1"
      - -label~=(do-not-merge)
      - status-success=build
    commit_message_format:
      title: pr-title
      body: pr-body
    merge_method: squash

pull_request_rules:
  - name: Automatic merge on approval and successful build
    conditions: []
    actions:
      queue:
